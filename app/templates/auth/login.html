{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">TCC</div>
      <div class="auth-tagline">Build · Deploy · Track · Grow</div>
    </div>
    <div class="auth-body">
      <h2>Sign in</h2>
      {% if error %}
      <div class="auth-error">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="tcc-form-group">
          <label for="email">Email address <span class="req">*</span></label>
          <input type="email" id="email" name="email" class="tcc-input"
                 placeholder="you@teamsylla.com" required autofocus
                 autocomplete="email">
        </div>
        <div class="tcc-form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" name="password" class="tcc-input"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-gold" style="width:100%;justify-content:center;padding:.7rem">
          Sign in to TCC
        </button>
      </form>
    </div>
    <div class="auth-footer">
      Teamsylla Command Center V1 &mdash; Internal use only.<br>
      Account creation is managed by a Super Admin.
    </div>
  </div>
</div>
{% endblock %}
